<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>건설현장 관리자 대시보드</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#0d0f14;--surface:#161a22;--card:#1c2130;--border:#2a3145;
      --accent:#f5a623;--danger:#e84545;--safe:#27c97e;--warning:#f5a623;
      --blue:#5b8af5;--purple:#a855f7;--cyan:#22d3ee;--text:#e8eaf0;--muted:#6b7592;
      --chrome:#13161f;--media-bg:#05070c;
    }
    body[data-theme="light"]{
      --bg:#eef2f7;--surface:#f8fafc;--card:#ffffff;--border:#d5deeb;
      --accent:#e69716;--danger:#dc2626;--safe:#15803d;--warning:#d08610;
      --blue:#2563eb;--purple:#7c3aed;--cyan:#0891b2;--text:#0f172a;--muted:#5f6b85;
      --chrome:#e9eff7;--media-bg:#dbe6f4;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);min-height:100vh;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

    /* TOP BAR */
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:24px 24px;background:var(--chrome);border-bottom:1px solid var(--border);}
    .topbar-left{display:flex;align-items:center;gap:16px;}
    .site-badge{display:flex;align-items:center;gap:18px;}
    .site-badge .icon{width:32px;height:32px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;}
    .site-name{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;}
    .site-sub{font-size:12px;color:var(--muted);margin-top: 4px;}
    .divider-v{width:1px;height:32px;background:var(--border);}
    .status-pill{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:100px;font-size:14px;font-weight:500;background:rgba(39,201,126,.12);border:1px solid rgba(39,201,126,.3);color:var(--safe);}
    .status-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--safe);animation:pulse 2s infinite;}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
    .topbar-right{display:flex;align-items:center;gap:16px;}
    .time-display{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);text-align:right;}
    .time-display .time{font-size:18px;color:var(--text);font-weight:600;}
    .ws-status{font-size:11px;padding:4px 10px;border-radius:100px;background:rgba(232,69,69,.15);border:1px solid rgba(232,69,69,.3);color:var(--danger);}
    .ws-status.connected{background:rgba(39,201,126,.12);border-color:rgba(39,201,126,.3);color:var(--safe);}

    /* SIDEBAR */
    .sidebar{background:var(--chrome);border-right:1px solid var(--border);padding:20px 0;display:flex;flex-direction:column;gap:4px;min-height:0;overflow-y:auto;}
    .sidebar-section{padding:0 14px;margin-bottom:8px;}
    .sidebar-label{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;padding:0 8px;margin-bottom:4px;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted);transition:all .2s;position:relative;}
    .nav-item:hover{background:rgba(255,255,255,.04);color:var(--text);}
    .nav-item.active{background:rgba(245,166,35,.1);color:var(--accent);}
    .nav-item.active::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--accent);border-radius:0 3px 3px 0;}
    .nav-icon{font-size:16px;width:20px;text-align:center;}
    .nav-count{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;padding:2px 6px;border-radius:100px;background:var(--danger);color:#fff;}
    .sidebar-footer{margin-top:auto;padding:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px;}
    .user-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--border);}
    .avatar{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#f5a623,#e84545);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;}
    .user-info .name{font-size:13px;font-weight:500;}
    .user-info .role{font-size:11px;color:var(--muted);}
    .theme-card{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--border);}
    .theme-card-label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:1px;text-transform:uppercase;}
    .theme-card-mode{font-size:12px;color:var(--text);margin-top:2px;}
    .theme-switch{position:relative;display:inline-block;width:46px;height:24px;flex-shrink:0;}
    .theme-switch input{opacity:0;width:0;height:0;}
    .theme-slider{position:absolute;inset:0;border-radius:100px;background:var(--border);cursor:pointer;transition:background .2s;}
    .theme-slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff;transition:transform .2s;}
    .theme-switch input:checked + .theme-slider{background:var(--accent);}
    .theme-switch input:checked + .theme-slider::before{transform:translateX(22px);}

    /* COMMON */
    .section-header{display:flex;align-items:center;justify-content:space-between;}
    .section-title{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:1.5px;color:var(--muted);}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;}
    .panel-title{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1.5px;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
    .btn-sm{font-size:11px;padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all .2s;font-family:'Noto Sans KR',sans-serif;}
    .btn-sm:hover{color:var(--text);border-color:var(--accent);}
    .btn-sm:disabled{opacity:.45;cursor:not-allowed;}
    .btn-sm:disabled:hover{color:var(--muted);border-color:var(--border);}
    .btn-primary{font-size:12px;padding:7px 16px;border-radius:8px;border:none;background:var(--accent);color:#111;cursor:pointer;font-weight:700;transition:opacity .2s;}
    .btn-primary:hover{opacity:.85;}
    .btn-danger{font-size:12px;padding:7px 16px;border-radius:8px;border:none;background:var(--danger);color:#fff;cursor:pointer;font-weight:700;}
    .btn-danger-xs{font-size:11px;padding:4px 10px;border-radius:6px;border:none;background:var(--danger);color:#fff;cursor:pointer;font-weight:700;}

    /* KPI */
    .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
        .kpi-grid-three{grid-template-columns:repeat(3,1fr);}
    .kpi-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;position:relative;overflow:hidden;transition:transform .2s,border-color .2s;}
    .kpi-card:hover{transform:translateY(-2px);border-color:var(--accent);}
    .kpi-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
    .kpi-card.ok::after{background:var(--safe);}
    .kpi-card.warn::after{background:var(--warning);}
    .kpi-card.bad::after{background:var(--danger);}
    .kpi-card.info::after{background:var(--blue);}
    .kpi-label{font-size:11px;color:var(--muted);letter-spacing:.5px;margin-bottom:8px;}
    .kpi-value{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:1px;line-height:1;margin-bottom:6px;}
    .kpi-card.ok .kpi-value{color:var(--safe);}
    .kpi-card.warn .kpi-value{color:var(--warning);}
    .kpi-card.bad .kpi-value{color:var(--danger);}
    .kpi-card.info .kpi-value{color:var(--blue);}
    .kpi-delta{font-size:11px;color:var(--muted);}
    .kpi-icon{position:absolute;bottom:12px;right:14px;font-size:26px;}

    /* ZONES */
    .zone-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
    .zone{border-radius:8px;padding:10px 12px;border:1px solid transparent;}
    .zone.safe{background:rgba(209, 215, 220, 0.08);border-color:rgba(103, 101, 108, 0.2);}
    .zone.caution{background:rgba(209, 215, 220, 0.08);border-color:rgba(103, 101, 108, 0.2);}
    .zone.danger{background:rgba(232,69,69,.1);border-color:rgba(232,69,69,.25);}
    .zone-name{font-size:11px;font-weight:700;letter-spacing:.5px;margin-bottom:4px;}
    .zone.safe .zone-name{color:var(--safe);}
    .zone.caution .zone-name{color:var(--safe);}
    .zone.danger .zone-name{color:var(--danger);}
    .zone-workers{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600;color:var(--text);}
    .zone-sub{font-size:10px;color:var(--muted);}

    /* PROGRESS */
    .progress-list{display:flex;flex-direction:column;gap:10px;}
    .progress-header{display:flex;justify-content:space-between;margin-bottom:5px;font-size:12px;}
    .progress-name{color:var(--text);font-weight:500;}
    .progress-pct{font-family:'JetBrains Mono',monospace;color:var(--muted);}
    .progress-track{height:5px;background:var(--border);border-radius:100px;overflow:hidden;}
    .progress-fill{height:100%;border-radius:100px;transition:width 1s ease;}

    /* ALERTS */
    .alert-list{display:flex;flex-direction:column;gap:8px;}
        .dashboard-alert-list{min-height:100%;justify-content:flex-start;}
    .alert-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid transparent;font-size:12px;}
    .alert-item.level-high{background:rgba(232,69,69,.07);border-color:rgba(232,69,69,.2);}
    .alert-item.level-mid{background:rgba(245,166,35,.07);border-color:rgba(245,166,35,.2);}
    .alert-item.level-low{background:rgba(91,138,245,.07);border-color:rgba(91,138,245,.2);}
    .alert-dot{width:8px;height:8px;border-radius:50%;margin-top:3px;flex-shrink:0;}
    .level-high .alert-dot{background:var(--danger);}
    .level-mid .alert-dot{background:var(--warning);}
    .level-low .alert-dot{background:var(--blue);}
    .alert-text{color:var(--text);line-height:1.5;}
    .alert-time{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);}
    .alert-resolve-btn{margin-left:auto;font-size:10px;padding:2px 8px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .2s;}
    .alert-resolve-btn:hover{border-color:var(--safe);color:var(--safe);}

    /* WORKER TABLE */
    .worker-table{width:100%;border-collapse:collapse;font-size:12px;}
    .worker-table th{text-align:left;padding:0 8px 8px;font-size:10px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);}
    .worker-table td{padding:9px 8px;border-bottom:1px solid rgba(42,49,69,.5);vertical-align:middle;}
    .worker-table tr:last-child td{border-bottom:none;}
    .worker-table tr:hover td{background:rgba(255,255,255,.02);}
    .worker-name{display:flex;align-items:center;gap:8px;}
    .mini-avatar{width:24px;height:24px;border-radius:5px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0;}
    .status-tag{display:inline-block;padding:2px 8px;border-radius:100px;font-size:10px;font-weight:500;}
    .status-tag.work{background:rgba(39,201,126,.15);color:var(--safe);}
    .status-tag.rest{background:rgba(245,166,35,.15);color:var(--warning);}
    .status-tag.absent{background:rgba(232,69,69,.15);color:var(--danger);}

    /* SENSOR */
    .sensor-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
    .sensor-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
    .sensor-icon{font-size:28px;margin-bottom:8px;}
    .sensor-label{font-size:11px;color:var(--muted);margin-bottom:6px;}
    .sensor-value{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:600;color:var(--text);}
    .sensor-unit{font-size:11px;color:var(--muted);}
    .sensor-status{font-size:11px;margin-top:6px;}
    .sensor-status.ok{color:var(--safe);}
    .sensor-status.warn{color:var(--warning);}
    .sensor-status.bad{color:var(--danger);}

    /* WEATHER */
    .weather-strip{display:flex;align-items:center;gap:20px;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px;}
    .weather-main{display:flex;align-items:center;gap:8px;}
    .weather-temp{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--text);}
    .weather-desc{font-size:11px;color:var(--muted);}
    .weather-divider{width:1px;height:30px;background:var(--border);}
    .weather-stat{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;}
    .weather-stat span{color:var(--text);font-weight:500;}

    /* FORM */
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .form-group{display:flex;flex-direction:column;gap:6px;}
    .form-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
    .form-input,.form-select{padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:13px;outline:none;transition:border-color .2s;}
    .form-input:focus,.form-select:focus{border-color:var(--accent);}
    .form-select option{background:var(--bg);}
    .form-textarea{padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:13px;outline:none;resize:vertical;width:100%;transition:border-color .2s;}
    .form-textarea:focus{border-color:var(--accent);}

    /* VOICE RECORDER */
    .recorder-box{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px;background:var(--bg);border-radius:12px;border:1px dashed var(--border);}
    .record-btn{width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;font-size:28px;transition:all .2s;background:var(--card);border:2px solid var(--border);}
    .record-btn.recording{background:rgba(232,69,69,.2);border-color:var(--danger);animation:recordPulse 1s ease infinite;}
    @keyframes recordPulse{0%,100%{box-shadow:0 0 0 0 rgba(232,69,69,.4);}50%{box-shadow:0 0 0 12px rgba(232,69,69,0);}}
    .record-status{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
    .record-timer{font-family:'JetBrains Mono',monospace;font-size:24px;color:var(--text);}
    .stt-result{width:100%;padding:12px;border-radius:8px;background:rgba(39,201,126,.05);border:1px solid rgba(39,201,126,.2);font-size:13px;line-height:1.7;color:var(--text);min-height:80px;white-space:pre-wrap;}

    /* PHOTO GALLERY */
    .photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
    .photo-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:transform .2s,border-color .2s;}
    .photo-card:hover{transform:translateY(-2px);border-color:var(--accent);}
    .photo-card.risk{border-color:rgba(232,69,69,.4);}
    .photo-card{cursor:pointer;}
    .photo-thumb{width:100%;height:120px;object-fit:cover;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--muted);}
    .photo-thumb img{width:100%;height:100%;object-fit:cover;}
    .photo-info{padding:10px 12px;}
    .photo-ai{font-size:10px;color:var(--muted);line-height:1.5;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .photo-risk-badge{display:inline-block;font-size:9px;padding:2px 7px;border-radius:100px;font-weight:700;}
    .photo-risk-badge.risk{background:rgba(232,69,69,.2);color:var(--danger);}
    .photo-risk-badge.safe{background:rgba(39,201,126,.2);color:var(--safe);}
    .photo-actions{display:flex;justify-content:flex-end;margin-top:8px;}
    .photo-delete-btn{font-size:10px;padding:4px 8px;border-radius:6px;border:1px solid rgba(232,69,69,.35);background:rgba(232,69,69,.08);color:var(--danger);cursor:pointer;transition:all .2s;}
    .photo-delete-btn:hover{background:rgba(232,69,69,.16);}

    /* PHOTO MODAL */
    .photo-modal{position:fixed;inset:0;background:rgba(5,9,16,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:2000;backdrop-filter:blur(3px);}
    .photo-modal.show{display:flex;}
    .photo-modal-dialog{width:min(940px,100%);max-height:90vh;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 320px;}
    .photo-modal-media{background:var(--media-bg);display:flex;align-items:center;justify-content:center;min-height:260px;}
    .photo-modal-media img{max-width:100%;max-height:88vh;object-fit:contain;display:block;}
    .photo-modal-side{padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;min-width:0;}
    .photo-modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
    .photo-modal-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px;color:var(--muted);}
    .photo-modal-close{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;}
    .photo-modal-close:hover{border-color:var(--accent);color:var(--text);}
    .photo-meta{display:flex;flex-wrap:wrap;gap:6px;}
    .photo-meta-badge{font-size:10px;padding:3px 8px;border-radius:999px;background:rgba(91,138,245,.12);border:1px solid rgba(91,138,245,.25);color:var(--blue);}
    .photo-meta-badge.risk{background:rgba(232,69,69,.14);border-color:rgba(232,69,69,.3);color:var(--danger);}
    .photo-modal-analysis{font-size:12px;line-height:1.75;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;white-space:pre-wrap;overflow:auto;min-height:140px;max-height:44vh;}
    .photo-modal-footer{display:flex;justify-content:flex-end;margin-top:auto;}
    .photo-modal-delete{font-size:12px;padding:7px 12px;border-radius:8px;border:1px solid rgba(232,69,69,.35);background:rgba(232,69,69,.1);color:var(--danger);font-weight:700;cursor:pointer;}
    .photo-modal-delete:hover{background:rgba(232,69,69,.18);}

    @media (max-width:900px){
      .photo-modal-dialog{grid-template-columns:1fr;}
      .photo-modal-side{max-height:45vh;}
    }

    @media (max-width:900px){
      .topbar{padding:12px 14px;gap:12px;flex-wrap:wrap;}
      .topbar-left,.topbar-right{width:100%;justify-content:space-between;}
      .sidebar{border-right:none;border-bottom:1px solid var(--border);padding:12px 0;}
      .sidebar-footer{margin-top:0;}
      .kpi-grid{grid-template-columns:repeat(2,1fr);}
          .kpi-grid-three{grid-template-columns:1fr;}
      .sensor-grid{grid-template-columns:repeat(2,1fr);}
      .weather-strip{flex-wrap:wrap;gap:10px;}
      .worker-table{display:block;overflow-x:auto;}
      .photo-grid{grid-template-columns:1fr;}
      .form-grid{grid-template-columns:1fr;}
      .zone-grid{grid-template-columns:repeat(2,1fr);}
          .dashboard-split-grid{grid-template-columns:1fr;}
      .photo-modal-dialog{grid-template-columns:1fr;}
      .photo-modal-side{max-height:45vh;}
    }

    /* UPLOAD ZONE */
    .upload-zone{border:2px dashed var(--border);border-radius:12px;padding:30px;text-align:center;cursor:pointer;transition:border-color .2s;}
    .upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);}
    .upload-zone-icon{font-size:36px;margin-bottom:10px;}
    .upload-zone-text{font-size:13px;color:var(--muted);}
    .photo-mode-row{display:flex;gap:8px;margin:10px 0 8px;}
    .photo-mode-btn{font-size:12px;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;font-weight:600;transition:all .2s;}
    .photo-mode-btn.active{background:rgba(0,229,255,.14);border-color:var(--accent);color:var(--text);}
    .photo-input-section{margin-top:10px;}
    .camera-box{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;}
    .camera-video-wrap{width:100%;border-radius:10px;overflow:hidden;background:var(--media-bg);border:1px solid var(--border);}
    .camera-video,.camera-preview{display:block;width:100%;max-height:320px;object-fit:cover;}
    .camera-actions{display:flex;gap:8px;margin-top:10px;}
    .camera-hint{font-size:11px;color:var(--muted);margin-top:8px;}

    /* REPORT LIST */
    .report-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:border-color .2s;}
    .report-item:hover{border-color:var(--accent);}
    .report-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;}
    .report-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);margin-bottom:0;}
    .report-author{font-size:11px;color:var(--muted);}
    .report-preview{font-size:12px;color:var(--text);margin-top:6px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .report-detail{font-size:13px;line-height:1.8;color:var(--text);white-space:pre-wrap;background:var(--bg);padding:16px;border-radius:8px;border:1px solid var(--border);margin-top:10px;}
    .report-delete-btn{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .2s;flex-shrink:0;}
    .report-delete-btn:hover{border-color:var(--danger);color:var(--danger);background:rgba(232,69,69,.08);}
    .report-delete-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

    /* LOADING */
    .loading{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:20px 0;}
    .spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    body[data-theme="light"] .nav-item:hover{background:rgba(15,23,42,.06);}
    body[data-theme="light"] .worker-table tr:hover td{background:rgba(15,23,42,.03);}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
